name: Build and portable offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- package-lock.json lib/client.js
      - run: npm run test:portable
      - name: Project memory and optional Hindsight regressions
        run: npm run test:memory
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Memory interface regressions
        run: node tools/mem04r1/ui-check.mjs "$RUNNER_TEMP/memory-ui.json"
